<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind an daisy ui integration -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fontawesome integration -->
    <script
      src="https://kit.fontawesome.com/43ad48246d.js"
      crossorigin="anonymous"
    ></script>

    <!-- link css file -->
    <link rel="stylesheet" href="./style.css" />
    <title>Github Issue Tracker</title>
  </head>
  <body class="bg-[#F8FAFC]">
    <!-- header section -->
    <header>
      <nav class="container mx-auto">
        <div class="navbar justify-between bg-base-100 shadow-sm">
          <div class="">
            <div class="flex items-center gap-3">
              <img class="h-8 w-8" src="./assets/github-logo.png" alt="" />
              <h2 class="font-bold text-lg hidden md:block">
                GitHub Issues Tracker
              </h2>
            </div>
          </div>

          <div class="flex gap-3">
            <div class="relative">
              <input
                type="text"
                placeholder="Search issues..."
                class="input w-24 md:w-auto pl-9"
              />
              <i
                class="fa-solid fa-magnifying-glass absolute top-[30%] left-4 text-gray-400"
              ></i>
            </div>
            <button class="btn btn-primary">
              <i class="fa-solid fa-plus"></i> New Issue
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main class="container w-[92%] md:w-[80%] mx-auto my-8">
      <!-- tab section -->
      <section>
        <div
          id="tab-btns"
          class="tab-btns bg-white rounded-md p-4 mb-4 space-x-2 shadow-sm"
        >
          <button id="all-btn" class="btn btn-primary text-white tab-btn">
            All
          </button>
          <button id="open-btn" class="btn tab-btn">Open</button>
          <button id="closed-btn" class="btn tab-btn">Closed</button>
        </div>
      </section>

      <!-- issues status section -->
      <section class="">
        <!-- issues bar -->
        <div
          class="flex justify-between bg-white rounded-tr-lg rounded-tl-lg p-4"
        >
          <div class="flex justify-center items-center gap-2">
            <img
              class="h-10 w-10 bg-[#ECE4FF] p-2 rounded-[50%]"
              src="./assets/Aperture.png"
              alt=""
            />
            <div>
              <h3 class="text-lg font-bold">
                <span id="issue-count">0</span> Issues
              </h3>
              <p>Track and manage your project issues</p>
            </div>
          </div>
          <div class="flex gap-8">
            <p class="flex items-center gap-2">
              <span class="bg-[#00A96E] h-3 w-3 rounded-[50%] block"></span>
              <span>Open</span>
            </p>
            <p class="flex items-center gap-2">
              <span class="bg-[#A855F7] h-3 w-3 rounded-[50%] block"></span>
              <span>Closed</span>
            </p>
          </div>
        </div>
        <hr class="border-none h-[2px] bg-[#E4E4E7]" />
      </section>

      <!-- spinner -->
      <section class="h-[50vh] flex justify-center items-center hidden" id="spinner">
        <span class="loading loading-bars loading-xl"></span>
      </section>

      <!-- issue all card container section -->
      <section
        id="all-card-container"
        class="bg-white p-4 shadow-lg grid gap-3 grid-cols-1 md:grid-cols-2 lg:grid-cols-4 rounded-bl-lg rounded-br-lg"
      ></section>

      <!-- modal -->
      <dialog id="my_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
          <div id="modal-des" class="space-y-4"></div>

          <div class="modal-action">
            <form method="dialog">
              <!-- if there is a button in form, it will close the modal -->
              <button class="btn btn-primary">Close</button>
            </form>
          </div>
        </div>
      </dialog>
    </main>

    <!-- link with js file -->
    <script src="./js/home.js"></script>
  </body>
</html>
