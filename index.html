<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind an daisy ui integration -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fontawesome integration -->
    <script
      src="https://kit.fontawesome.com/43ad48246d.js"
      crossorigin="anonymous"
    ></script>

    <!-- link css file -->
    <link rel="stylesheet" href="./style.css" />
    <title>Github Issue Tracker</title>
  </head>
  <body class="bg-[#F8FAFC]">
    <!-- login page -->
    <section class="flex flex-col justify-center items-center min-h-screen">
      <fieldset
        class="fieldset bg-white shadow-sm border-base-300 rounded-box w-xs border p-4"
      >
        <div class="text-center space-y-1 mb-4">
          <img
            class="mx-auto h-16 w-16 my-4"
            src="./assets/github-logo.png"
            alt=""
          />
          <h2 class="font-bold text-lg">GitHub Issues Tracker</h2>
          <p class="text-[#64748B]">Sign in to manage your issues</p>
        </div>

        <label class="label font-semibold text-black">Username</label>
        <input
          type="text"
          class="input"
          placeholder="Enter Username"
          id="username"
        />
        <p class="text-[#4A00FF]">Default: admin</p>

        <label class="label font-semibold text-black">Password</label>
        <input
          type="password"
          class="input"
          placeholder="Enter Password"
          id="password"
        />
        <p class="text-[#4A00FF]">Default: admin123</p>

        <button class="btn btn-primary mt-4">Sign In</button>

        <div class="flex items-center gap-2 mt-2">
          <hr class="flex-1 border-gray-200" />
          <span class="text-base"> Or </span>
          <hr class="flex-1 border-gray-200" />
        </div>
        <p class="text-[#64748B] text-center">Demo Credentials:</p>
        <div class="bg-[#F8FAFC] text-center rounded py-4">
          <p><span class="font-semibold text-black">Username:</span> admin</p>
          <p>
            <span class="font-semibold text-black">Password:</span> admin123
          </p>
        </div>
      </fieldset>
    </section>

    <!-- link with js file -->
    <script src="./js/script.js"></script>
  </body>
</html>
